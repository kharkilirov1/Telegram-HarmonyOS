<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#152243"/>
      <stop offset="45%" stop-color="#070B15"/>
      <stop offset="100%" stop-color="#020305"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#75C8FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9DDDFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#75C8FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.25"/>
    </filter>
    <clipPath id="iconMask">
      <rect x="4" y="4" width="100" height="100" rx="24"/>
    </clipPath>
    <clipPath id="belowHorizon">
      <rect x="0" y="54" width="108" height="54"/>
    </clipPath>
  </defs>

  <g clip-path="url(#iconMask)">
    <rect width="108" height="108" fill="url(#bg)"/>
    <rect width="108" height="108" fill="#0A1228" opacity="0.18"/>

    <circle cx="54" cy="42" r="32" fill="none" stroke="#1F315F" stroke-width="1.5" opacity="0.45"/>
    <circle cx="54" cy="42" r="28" fill="none" stroke="#243A72" stroke-width="10" opacity="0.28"/>
    <circle cx="54" cy="42" r="23" fill="none" stroke="#F8FBFF" stroke-width="10" filter="url(#glow)"/>

    <ellipse cx="54" cy="55" rx="35" ry="5" fill="#7FD1FF" opacity="0.18" filter="url(#softBlur)"/>
    <rect x="0" y="53.5" width="108" height="1.5" fill="url(#horizon)" filter="url(#glow)"/>

    <g clip-path="url(#belowHorizon)" opacity="0.82" filter="url(#softBlur)">
      <circle cx="54" cy="42" r="23" fill="none" stroke="#F4F8FF" stroke-width="2" opacity="0.55"/>
      <circle cx="54" cy="42" r="26" fill="none" stroke="#DCEBFF" stroke-width="2" opacity="0.42"/>
      <circle cx="54" cy="42" r="29" fill="none" stroke="#BDD8FF" stroke-width="2" opacity="0.32"/>
      <circle cx="54" cy="42" r="32" fill="none" stroke="#9BC8FF" stroke-width="1.8" opacity="0.24"/>
      <circle cx="54" cy="42" r="35" fill="none" stroke="#7AB9FF" stroke-width="1.7" opacity="0.18"/>
      <circle cx="54" cy="42" r="38" fill="none" stroke="#63A8FF" stroke-width="1.5" opacity="0.14"/>
    </g>

    <ellipse cx="54" cy="73" rx="24" ry="12" fill="#8BCBFF" opacity="0.12" filter="url(#softBlur)"/>

    <g transform="translate(6,-1)">
      <path d="M25 52l35-20 3 1.5-10 38-8-1 4-18-17 10-7-10.5zm38-15l-24 14 12 8 5-3 7-19z"
            fill="#37B5FF"
            filter="url(#glow)"/>
      <path d="M25 52l35-20 3 1.5-10 38-8-1 4-18-17 10-7-10.5zm38-15l-24 14 12 8 5-3 7-19z"
            fill="#2EA8F7"/>
    </g>

    <rect x="4" y="4" width="100" height="100" rx="24" fill="none" stroke="#203764" stroke-width="1" opacity="0.45"/>
  </g>
</svg>
