name: Smoke CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke-static:
    name: Smoke (static checks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify required docs
        shell: bash
        run: |
          test -f docs/ai/AI_MEMORY.md
          test -f docs/ai/UI_MIGRATION_PLAN.md
          test -f docs/ai/VISUAL_QA_CHECKLIST.md

      - name: tg_ui shell smoke checks
        shell: bash
        run: bash ./scripts/smoke-ui-phase0.sh

  smoke-host:
    name: Smoke (host behavioral tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run all host behavioral suites
        run: node scripts/run-host-tests.cjs

  smoke-build-harmony:
    name: Smoke (hvigor build)
    needs: [smoke-static, smoke-host]
    if: ${{ vars.HARMONYOS_SMOKE_BUILD == 'true' }}
    runs-on: [self-hosted, Windows, HarmonyOS]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build HAP
        shell: pwsh
        run: ./scripts/smoke-build.ps1

      - name: Upload build artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: harmonyos-build-output
          path: |
            entry/build/**/outputs/**/*.hap
            build/outputs/**/*.app
          if-no-files-found: ignore
