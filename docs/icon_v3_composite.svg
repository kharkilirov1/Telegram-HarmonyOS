<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0E1B3D"/>
      <stop offset="40%" stop-color="#060C1A"/>
      <stop offset="100%" stop-color="#010204"/>
    </radialGradient>

    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#B0D4FF" stop-opacity="0.10"/>
      <stop offset="80%" stop-color="#7AB8FF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="planeGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#5BC5F2"/>
      <stop offset="50%" stop-color="#2EA6F0"/>
      <stop offset="100%" stop-color="#1A8CD8"/>
    </linearGradient>

    <filter id="ringBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="outerRingBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <filter id="planeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="iconClip">
      <rect x="0" y="0" width="1024" height="1024" rx="220"/>
    </clipPath>
  </defs>

  <g clip-path="url(#iconClip)">
    <!-- === BACKGROUND === -->
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#ringGlow)"/>

    <!-- === FULL RING — center (512, 512) === -->

    <!-- Outermost atmospheric glow -->
    <circle cx="512" cy="512" r="280" fill="none" stroke="#3A70AA" stroke-width="120" opacity="0.05" filter="url(#outerRingBlur)"/>

    <!-- Full bright ring -->
    <circle cx="512" cy="512" r="230" fill="none" stroke="#D0E8FF" stroke-width="110" opacity="0.12" filter="url(#ringBlur)"/>
    <circle cx="512" cy="512" r="230" fill="none" stroke="#F0F8FF" stroke-width="80" filter="url(#ringBlur)"/>
    <circle cx="512" cy="512" r="230" fill="none" stroke="#FFFFFF" stroke-width="40" opacity="0.7"/>
    <!-- Inner edge -->
    <circle cx="512" cy="512" r="195" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.5"/>
    <!-- Outer edge -->
    <circle cx="512" cy="512" r="265" fill="none" stroke="#C0DDFF" stroke-width="4" opacity="0.35"/>

    <!-- === TELEGRAM PLANE — centered at (512, 512) === -->
    <!-- Visual centroid ~(55, 42) in 100x100. Scale 3.0 → (165, 126) -->
    <!-- Translate: (512-165, 512-126) = (347, 386) -->
    <g transform="translate(332, 386) scale(3.0)" filter="url(#planeGlow)">
      <path d="M88.723,12.142C76.419,17.238,23.661,39.091,9.084,45.047c-9.776,3.815-4.053,7.392-4.053,7.392s8.345,2.861,15.499,5.007c7.153,2.146,10.968-0.238,10.968-0.238l33.62-22.652c11.922-8.107,9.061-1.431,6.199,1.431c-6.199,6.2-16.452,15.975-25.036,23.844c-3.815,3.338-1.908,6.199-0.238,7.63c6.199,5.246,23.129,15.976,24.082,16.691c5.037,3.566,14.945,8.699,16.452-2.146c0,0,5.961-37.435,5.961-37.435c1.908-12.637,3.815-24.321,4.053-27.659C97.307,8.804,88.723,12.142,88.723,12.142z"
            fill="url(#planeGrad)"/>
    </g>
    <!-- White highlight -->
    <g transform="translate(332, 386) scale(3.0)" opacity="0.12">
      <path d="M88.723,12.142C76.419,17.238,23.661,39.091,9.084,45.047c-9.776,3.815-4.053,7.392-4.053,7.392s8.345,2.861,15.499,5.007c7.153,2.146,10.968-0.238,10.968-0.238l33.62-22.652c11.922-8.107,9.061-1.431,6.199,1.431c-6.199,6.2-16.452,15.975-25.036,23.844c-3.815,3.338-1.908,6.199-0.238,7.63c6.199,5.246,23.129,15.976,24.082,16.691c5.037,3.566,14.945,8.699,16.452-2.146c0,0,5.961-37.435,5.961-37.435c1.908-12.637,3.815-24.321,4.053-27.659C97.307,8.804,88.723,12.142,88.723,12.142z"
            fill="#FFFFFF"/>
    </g>

    <!-- Border -->
    <rect x="0" y="0" width="1024" height="1024" rx="220" fill="none" stroke="#1A2D55" stroke-width="3" opacity="0.4"/>
  </g>
</svg>
